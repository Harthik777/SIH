services:
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_NEO4J_URI: bolt://neo4j:7687
      SENTINEL_NEO4J_USER: neo4j
      SENTINEL_NEO4J_PASSWORD: sentinel-password
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_PERSISTENCE_MODE: hybrid
      SENTINEL_ALLOWED_ORIGINS: http://localhost:5173
      SENTINEL_AUTH_MODE: required
      SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:?Set SENTINEL_SECRET_KEY in .env}
      SENTINEL_ANALYST_EMAIL: ${SENTINEL_ANALYST_EMAIL:-analyst@sentinel.local}
      SENTINEL_ANALYST_PASSWORD: ${SENTINEL_ANALYST_PASSWORD:?Set SENTINEL_ANALYST_PASSWORD in .env}
      SENTINEL_ANALYST_PASSWORD_HASH: ${SENTINEL_ANALYST_PASSWORD_HASH:-}
      SENTINEL_SUPERVISOR_EMAIL: ${SENTINEL_SUPERVISOR_EMAIL:-supervisor@sentinel.local}
      SENTINEL_SUPERVISOR_PASSWORD: ${SENTINEL_SUPERVISOR_PASSWORD:?Set SENTINEL_SUPERVISOR_PASSWORD in .env}
      SENTINEL_SUPERVISOR_PASSWORD_HASH: ${SENTINEL_SUPERVISOR_PASSWORD_HASH:-}
      SENTINEL_UPLOAD_DIR: /app/state/uploads
      SENTINEL_INVESTIGATION_DIR: /app/state/investigations
      SENTINEL_AUDIT_PATH: /app/state/audit/audit_chain.jsonl
      SENTINEL_DECISIONS_PATH: /app/state/decisions/suraksha_resolution_decisions.json
    volumes:
      - sentinel_state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=info
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_NEO4J_URI: bolt://neo4j:7687
      SENTINEL_NEO4J_PASSWORD: sentinel-password
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_UPLOAD_DIR: /app/state/uploads
      SENTINEL_INVESTIGATION_DIR: /app/state/investigations
      SENTINEL_AUDIT_PATH: /app/state/audit/audit_chain.jsonl
      SENTINEL_DECISIONS_PATH: /app/state/decisions/suraksha_resolution_decisions.json
    volumes:
      - sentinel_state:/app/state
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/sentinel-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sentinel_state:
  postgres_data:
  neo4j_data:
  redis_data:
