services:
  - type: web
    name: sentinel-sih-26189-harthik
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SENTINEL_ENVIRONMENT
        value: production-authenticated-web
      - key: SENTINEL_PUBLIC_DEMO
        value: "false"
      - key: SENTINEL_AUTH_MODE
        value: required
      - key: SENTINEL_PERSISTENCE_MODE
        value: postgres
      - key: SENTINEL_DATABASE_URL
        fromDatabase:
          name: sentinel-sih-postgres
          property: connectionString
      - key: SENTINEL_CONNECTIVITY_MODE
        value: hybrid
      - key: SENTINEL_AUDIT_ANCHOR_MODE
        value: opentimestamps
      - key: SENTINEL_AUDIT_ANCHOR_PUBLIC_LIMIT
        value: "3"
      - key: SENTINEL_RATE_LIMIT_PER_MINUTE
        value: "240"
      - key: SENTINEL_MAX_UPLOAD_MB
        value: "25"
      - key: SENTINEL_ALLOWED_ORIGINS
        value: https://sentinel-sih-26189-harthik.onrender.com
      - key: SENTINEL_SECRET_KEY
        generateValue: true
      - key: SENTINEL_ANALYST_PASSWORD
        generateValue: true
      - key: SENTINEL_SUPERVISOR_PASSWORD
        generateValue: true

databases:
  - name: sentinel-sih-postgres
    plan: free
    region: singapore
    databaseName: sentinel
    user: sentinel
    postgresMajorVersion: "18"
    ipAllowList: []
